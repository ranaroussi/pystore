{% set name = "pystore" %}
{% set version = "1.0.2.dev0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  # NOTE: This sha256 is a placeholder. Conda-forge updates it automatically
  # during feedstock creation, but users building directly from meta.yaml
  # will get a checksum mismatch. Update this hash after building the sdist.
  sha256: "a748dc3b9e0ebb9382e6f1491c64cf19bfb876d515bad2a52536e4177e5d6006"

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  host:
    - pip
    - python >=3.9
    - cloudpickle ==3.1.1
    - dask ==2024.8.0  # [py<310]
    - dask ==2025.7.0  # [py>=310]
    - distributed ==2024.8.0  # [py<310]
    - distributed ==2025.7.0  # [py>=310]
    - fsspec ==2025.7.0
    - numpy ==1.26.4
    - pandas ==2.3.1
    - partd ==1.4.2
    - pyarrow ==21.0.0
    - python-snappy ==0.7.3
    - toolz ==1.0.0
  run:
    - python >=3.9
    - cloudpickle 3.1.*
    - dask 2024.8.*  # [py<310]
    - dask 2025.7.*  # [py>=310]
    - distributed 2024.8.*  # [py<310]
    - distributed 2025.7.*  # [py>=310]
    - fsspec 2025.7.*
    - numpy 1.26.*
    - pandas 2.3.*
    - partd 1.4.*
    - pyarrow 21.0.*
    - python-snappy 0.7.*
    - toolz 1.0.*

test:
  imports:
    - pystore

about:
  home: "https://github.com/ranaroussi/pystore"
  license: "Apache-2.0"
  license_family: "APACHE"
  license_file: "LICENSE.txt"
  summary: "Fast data store for Pandas time-series data"
  description: |
    PyStore is a simple (yet powerful) datastore for Pandas dataframes,
    and while it can store any Pandas object, it was designed with
    storing timeseries data in mind.
  doc_url: "https://pystore.readthedocs.io"
  dev_url: "https://github.com/ranaroussi/pystore"
  doc_source_url: "https://github.com/ranaroussi/pystore/blob/main/README.md"


extra:
  recipe-maintainers:
    - ranaroussi
