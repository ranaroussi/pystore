{% set name = "pystore" %}
{% set version = "1.0.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: "a748dc3b9e0ebb9382e6f1491c64cf19bfb876d515bad2a52536e4177e5d6006"

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  host:
    - pip
    - python >=3.9
    - cloudpickle >=3.0.0
    - dask >=2024.1.0
    - distributed >=2024.1.0
    - fsspec >=2023.1.0
    - multitasking >=0.0.11
    - numpy >=1.24.0,<3.0.0
    - pandas >=2.0.0,<3.0.0
    - partd >=1.4.0
    - pyarrow >=15.0.0
    - python-snappy >=0.6.1
    - toolz >=0.12.0
  run:
    - python >=3.9
    - cloudpickle >=3.0.0
    - dask >=2024.1.0
    - distributed >=2024.1.0
    - fsspec >=2023.1.0
    - multitasking >=0.0.11
    - numpy >=1.24.0,<3.0.0
    - pandas >=2.0.0,<3.0.0
    - partd >=1.4.0
    - pyarrow >=15.0.0
    - python-snappy >=0.6.1
    - toolz >=0.12.0

test:
  imports:
    - pystore

about:
  home: "https://github.com/ranaroussi/pystore"
  license: "Apache-2.0"
  license_family: "APACHE"
  license_file: "LICENSE.txt"
  summary: "Fast data store for Pandas time-series data"
  description: |
    PyStore is a simple (yet powerful) datastore for Pandas dataframes,
    and while it can store any Pandas object, it was designed with
    storing timeseries data in mind.
  doc_url: "https://pystore.readthedocs.io"
  dev_url: "https://github.com/ranaroussi/pystore"
  doc_source_url: "https://github.com/ranaroussi/pystore/blob/main/README.md"


extra:
  recipe-maintainers:
    - ranaroussi
