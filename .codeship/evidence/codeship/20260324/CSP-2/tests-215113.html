<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>tests — proof terminal recording</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; height: 100%; }
  body { background: transparent; -webkit-font-smoothing: antialiased; font-family: system-ui, sans-serif; }
  .player {
    background: #0d1117;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #terminal {
    height: calc(100% - 40px);
    padding: 14px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.4;
    color: #fff;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-y: auto;
    opacity: .9;
  }
  .controls {
    padding: 6px 10px;
    border-top: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 40px;
  }
  .btn {
    background: none;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: system-ui;
  }
  .btn:hover { background: #21262d; }
  .speed-select {
    background: #0d1117;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-family: system-ui;
    cursor: pointer;
  }
  .speed-select:hover { background: #21262d; }
  .progress {
    flex: 1;
    height: 4px;
    background: #21262d;
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress-bar {
    height: 100%;
    background: #58a6ff;
    width: 0%;
    transition: width 0.1s linear;
  }
  .time { color: #8b949e; font-size: 12px; font-family: monospace; min-width: 40px; text-align: right; line-height: 27px; }
</style>
</head>
<body>
<div class="player">
  <div id="terminal"></div>
  <div class="controls">
    <button class="btn" id="playBtn" onclick="toggle()">Play</button>
    <select class="speed-select" id="speedSelect" onchange="changeSpeed(this.value)"><option value="0.1" selected>0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2x</option><option value="4">4x</option></select>
    <div class="progress" onclick="seek(event)"><div class="progress-bar" id="bar"></div></div>
    <span class="time" id="time">0.0s / 196ms</span>
  </div>
</div>
<script>
const events = [{"time":0,"data":"\u001b[1m================================================= test session starts ==================================================\u001b[0m\nplatform darwin -- Python 3.10.18, pytest-8.4.2, pluggy-1.5.0 -- /Users/ran/opt/anaconda3/bin/python\n"},{"time":0.14800000000000008,"data":"cachedir: .pytest_cache\nhypothesis profile 'default' -> database=DirectoryBasedExampleDatabase(PosixPath('/Users/ran/Projects/ralph/.hypothesis/examples'))\nrootdir: /Users/ran/Projects/ralph\nplugins: cov-6.0.0, asyncio-1.2.0, anyio-4.12.0, typeguard-3.0.2, mock-3.10.0, requests-mock-1.10.0, hypothesis-6.131.9\nasyncio: mode=strict, debug=False, asyncio_default_fixture_loop_scope=None, asyncio_default_test_loop_scope=function\n"},{"time":0.14800000000000008,"data":"\u001b[1mcollecting ... \u001b[0mcollected 0 items\n"},{"time":0.14800000000000008,"data":"\n"},{"time":0.14800000000000008,"data":"\u001b[33m================================================ \u001b[33mno tests ran\u001b[0m\u001b[33m in 0.15s\u001b[0m\u001b[33m =================================================\u001b[0m\n"},{"time":0.196,"data":"\u001b[31mERROR: file or directory not found: tests/\n\u001b[0m\n"}];
const totalDuration = 0.196;
const realDuration = 0.196;
const term = document.getElementById('terminal');
const bar = document.getElementById('bar');
const timeEl = document.getElementById('time');
const playBtn = document.getElementById('playBtn');

let playing = false;
let currentIdx = 0;
let startTs = 0;
let pausedAt = 0;
let speed = 0.1;
let raf = null;

// Convert ANSI to styled HTML spans
function ansiToHtml(str) {
  const colors = ['#0d1117','#ff7b72','#3fb950','#d29922','#58a6ff','#bc8cff','#39d2e0','#e6edf3'];
  const brights = ['#484f58','#ffa198','#56d364','#e3b341','#79c0ff','#d2a8ff','#56d4dd','#f0f6fc'];
  let out = '';
  let i = 0;
  while (i < str.length) {
    if (str[i] === '\x1b' || str.charCodeAt(i) === 0x1b) {
      const m = str.slice(i).match(/^(?:\x1b|\u001b|\033|\x1B)\[([0-9;]*)m/);
      if (m) {
        const codes = m[1].split(';').map(Number);
        let style = '';
        for (const c of codes) {
          if (c === 0) style += 'color:#e6edf3;font-weight:normal;font-style:normal;text-decoration:none;';
          else if (c === 1) style += 'font-weight:bold;';
          else if (c === 2) style += 'opacity:0.6;';
          else if (c === 3) style += 'font-style:italic;';
          else if (c === 4) style += 'text-decoration:underline;';
          else if (c >= 30 && c <= 37) style += 'color:' + colors[c - 30] + ';';
          else if (c >= 90 && c <= 97) style += 'color:' + brights[c - 90] + ';';
        }
        if (style) out += '</span><span style="' + style + '">';
        i += m[0].length;
        continue;
      }
    }
    const ch = str[i];
    if (ch === '<') out += '&lt;';
    else if (ch === '>') out += '&gt;';
    else if (ch === '&') out += '&amp;';
    else out += ch;
    i++;
  }
  return out;
}

function renderUpTo(elapsed) {
  let html = '<span>';
  for (let j = 0; j < events.length; j++) {
    if (events[j].time > elapsed) { currentIdx = j; break; }
    html += ansiToHtml(events[j].data);
    if (j === events.length - 1) currentIdx = events.length;
  }
  html += '</span>';
  term.innerHTML = html;
  term.scrollTop = term.scrollHeight;
  const pct = totalDuration > 0 ? Math.min(100, (elapsed / totalDuration) * 100) : 100;
  bar.style.width = pct + '%';
  timeEl.textContent = elapsed.toFixed(1) + 's';
}

function tick() {
  if (!playing) return;
  const elapsed = ((Date.now() - startTs) / 1000) * speed;
  if (elapsed >= totalDuration) {
    renderUpTo(totalDuration);
    playing = false;
    playBtn.textContent = 'Replay';
    return;
  }
  renderUpTo(elapsed);
  raf = requestAnimationFrame(tick);
}

function toggle() {
  if (playing) {
    playing = false;
    pausedAt = ((Date.now() - startTs) / 1000) * speed;
    playBtn.textContent = 'Play';
    if (raf) cancelAnimationFrame(raf);
  } else {
    if (currentIdx >= events.length) {
      pausedAt = 0;
      term.innerHTML = '';
      currentIdx = 0;
    }
    playing = true;
    playBtn.textContent = 'Pause';
    startTs = Date.now() - (pausedAt / speed) * 1000;
    tick();
  }
}

function changeSpeed(val) {
  if (playing) pausedAt = ((Date.now() - startTs) / 1000) * speed;
  speed = parseFloat(val);
  if (playing) {
    startTs = Date.now() - (pausedAt / speed) * 1000;
  }
}

function seek(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  pausedAt = pct * totalDuration;
  renderUpTo(pausedAt);
  if (playing) {
    startTs = Date.now() - (pausedAt / speed) * 1000;
  }
}

// Render first frame
renderUpTo(0);
</script>
</body>
</html>
