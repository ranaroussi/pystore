[build-system]
requires = ["setuptools==77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pystore"
dynamic = ["version"]
description = "Fast data store for Pandas timeseries data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Ran Aroussi", email = "ran@aroussi.com"},
]
maintainers = [
    {name = "PyStore Maintainers", email = "pystore@example.com"},
]
keywords = ["dask", "datastore", "flatfile", "pystore", "timeseries", "pandas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "dask[complete]==2024.8.0; python_version < '3.10'",
    "dask[complete]==2025.7.0; python_version >= '3.10'",
    "numpy==1.26.4",
    "fsspec==2025.7.0",
    "toolz==1.0.0",
    "cloudpickle==3.1.1",
    "python-snappy==0.7.3",
    "partd==1.4.2",
]

[project.optional-dependencies]
monitoring = [
    "psutil==7.0.0",
]
dev = [
    "build==1.4.2",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "pytest-xdist==3.8.0",
    "black==25.1.0",
    "ruff==0.12.4",
    "mypy==1.17.0",
    "pandas-stubs==2.2.2.240807; python_version < '3.10'",
    "pandas-stubs==2.3.0.250703; python_version >= '3.10'",
    "types-setuptools==80.9.0.20250529",
]
docs = [
    "sphinx==7.4.7; python_version < '3.10'",
    "sphinx==8.1.3; python_version == '3.10'",
    "sphinx==8.2.3; python_version >= '3.11'",
    "sphinx-rtd-theme==3.0.2",
    "sphinx-autodoc-typehints==2.3.0; python_version < '3.10'",
    "sphinx-autodoc-typehints==3.0.1; python_version == '3.10'",
    "sphinx-autodoc-typehints==3.2.0; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/ranaroussi/pystore"
Documentation = "https://pystore.readthedocs.io"
Repository = "https://github.com/ranaroussi/pystore"
Issues = "https://github.com/ranaroussi/pystore/issues"
Changelog = "https://github.com/ranaroussi/pystore/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pystore"]
include-package-data = true

[tool.setuptools.package-data]
pystore = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "pystore.__version__"}

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["pystore"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
